# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-26.04, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        ffmpeg_from_vcpkg: [ON, OFF]
        ffmpeg_from_pkgconfig: [ON, OFF]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            use_pthreads: ON
          - os: ubuntu-26.04
            c_compiler: gcc
            cpp_compiler: g++
            use_pthreads: OFF
          - os: ubuntu-26.04
            c_compiler: clang
            cpp_compiler: clang++
            use_pthreads: OFF
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-26.04
            c_compiler: cl
          - ffmpeg_from_vcpkg: ON
            ffmpeg_from_pkgconfig: ON
          - ffmpeg_from_vcpkg: OFF
            ffmpeg_from_pkgconfig: OFF
            os: ubuntu-26.04
          # VCPKG is fucking broken on this pos github runner.
          - ffmpeg_from_vcpkg: ON
          - os: windows-latest
            ffmpeg_from_pkgconfig: ON

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "vcpkg-toolchain=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_OUTPUT"

    - name: Install prereqs on linux
      if: ${{ contains(matrix.os, 'ubuntu') }}
      id: install
      run: >
        sudo apt-get update

        sudo apt-get install libavutil-dev libavcodec-dev
        libswresample-dev libavformat-dev nasm libasound2-dev libx11-dev libxrandr-dev
        libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
        libxkbcommon-dev autoconf autoconf-archive automake libtool

        # git clone https://github.com/microsoft/vcpkg.git
        #
        # cd vcpkg
        #
        # echo "vcpkg-toolchain=$(pwd)/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_OUTPUT"
        #
        # ./bootstrap-vcpkg.sh
    # - name: Install ffmpeg binaries on windows
    #   if: ${{ contains(matrix.os, 'windows') }}
    #   id: ffmp
    #   shell: powershell
    #   run: |
    #     Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z -OutFile ffmpeg-shared.7z
    #     & 7z x .\ffmpeg-shared.7z -y
    #     (Get-ChildItem -Directory | Where-Object {$_.Name -like "*ffmpeg*"} | Select-Object -First 1 | ForEach-Object { "ffmp-dir=$($_.Name)" }) >> $GITHUB_OUTPUT

    # - name: Update vcpkg root
    #   shell: bash
    #   run: |
    #     cd $VCPKG_INSTALLATION_ROOT
    #     git reset --hard
    #     git pull
    #     cd -

    - name: download ffmpeg from github
      uses: robinraju/release-downloader@v1
      if: ${{ contains(matrix.os, 'windows') }}
      id: ffmp
      with:
          repository: 'GyanD/codexffmpeg'
          tag: '9.0.1'
          fileName: 'ffmpeg-9.0.1-full_build-shared.zip'
          extract: true

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.vcpkg-toolchain }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DFFMPEG_DIR="./ffmpeg-9.0.1-full_build-shared"
        -DUSE_FFMPEG_FROM_VCPKG=${{ matrix.ffmpeg_from_vcpkg }}
        -DUSE_FFMPEG_FROM_PKGCONFIG=${{ matrix.ffmpeg_from_pkgconfig }}
        -DUSE_PTHREADS4W=${{ matrix.use_pthreads }}
        -DVCPKG_TARGET_TRIPLET=${{ case( matrix.os == 'ubuntu-26.04', 'x64-linux', 
        matrix.os == 'windows-latest', 'x64-windows-static-md-release',
        '' ) }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

#    - name: Test
#      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
#      run: ctest --build-config ${{ matrix.build_type }}
